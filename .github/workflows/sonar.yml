name: SonarQube / SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Sonar scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect SONAR_TOKEN
        id: creds
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "Sonar token present — scan will run"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN not configured. Skipping Sonar scan. See docs/SONARQUBE.md"
          fi

      - name: Set up Python
        if: steps.creds.outputs.has_token == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps & coverage
        if: steps.creds.outputs.has_token == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/ -q --cov=app --cov-report=xml --cov-report=term

      - name: Set up Node.js
        if: steps.creds.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Frontend install
        if: steps.creds.outputs.has_token == 'true'
        working-directory: frontend
        run: npm install

      - name: SonarCloud / SonarQube Scan
        if: steps.creds.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'alianisreyesr_gxp-change-control' }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'alianisreyesr' }}

      - name: Quality Gate
        if: steps.creds.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

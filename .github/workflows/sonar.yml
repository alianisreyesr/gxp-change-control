name: SonarQube / SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Sonar scan
    runs-on: ubuntu-latest
    # Skip gracefully when SONAR_TOKEN is not configured (local forks / before setup)
    if: ${{ secrets.SONAR_TOKEN != '' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for blame / new code detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps & run tests with coverage
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/ -q --cov=app --cov-report=xml --cov-report=term

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Frontend install (for analysis paths)
        working-directory: frontend
        run: npm install

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Optional: self-hosted SonarQube — set repo variable SONAR_HOST_URL
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'alianisreyesr_gxp-change-control' }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'alianisreyesr' }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

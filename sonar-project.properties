# SonarCloud / SonarQube — GxP Change Control (portfolio)
# Override organization/projectKey if your SonarCloud keys differ.

sonar.projectKey=alianisreyesr_gxp-change-control
sonar.organization=alianisreyesr
sonar.projectName=GxP Change Control
sonar.projectVersion=1.0.0

sonar.sources=app,frontend/src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# TypeScript / JS
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/venv/**,**/data/**,**/*.db,frontend/dist/**
sonar.test.exclusions=**/node_modules/**

sonar.coverage.exclusions=**/tests/**,frontend/src/main.tsx,frontend/src/vite-env.d.ts

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - change-data:/app/data
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional: serve static frontend build (run `npm run build` in frontend/ first,
  # or build with the frontend Dockerfile target in a fuller setup).
  # For local dev prefer: cd frontend && npm run dev (proxies /api → :8000).

volumes:
  change-data:
